  <rect x="330" y="222" width="620" height="70" rx="20" fill="#ffffff" opacity=".075"/>
  <text x="360" y="266" fill="#f7f0ff" font-family="Inter, system-ui, sans-serif" font-size="25" font-weight="750">Ask Ghost to summarize the current project</text>
