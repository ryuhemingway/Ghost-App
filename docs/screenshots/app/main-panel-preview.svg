<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="820" viewBox="0 0 1280 820" role="img" aria-label="Ghost main panel visual preview">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#160d23"/><stop offset=".48" stop-color="#05030a"/><stop offset="1" stop-color="#0d1820"/></linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ffffff" stop-opacity=".16"/><stop offset=".55" stop-color="#ffffff" stop-opacity=".06"/><stop offset="1" stop-color="#76e4d3" stop-opacity=".1"/></linearGradient>
  </defs>
  <rect width="1280" height="820" fill="url(#bg)"/>
  <circle cx="230" cy="120" r="220" fill="#8b5cff" opacity=".22"/>
  <circle cx="1050" cy="610" r="250" fill="#76e4d3" opacity=".14"/>
  <rect x="252" y="86" width="776" height="648" rx="34" fill="url(#panel)" stroke="#f7f0ff" stroke-opacity=".18"/>
  <rect x="286" y="122" width="708" height="576" rx="26" fill="#05030a" opacity=".84"/>
  <circle cx="330" cy="160" r="10" fill="#f7f0ff" opacity=".34"/><circle cx="362" cy="160" r="10" fill="#f7f0ff" opacity=".22"/><circle cx="394" cy="160" r="10" fill="#f7f0ff" opacity=".18"/>
