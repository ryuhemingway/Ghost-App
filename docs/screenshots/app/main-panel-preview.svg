  <text x="360" y="474" fill="#f7f0ff" font-family="Inter, system-ui, sans-serif" font-size="24" font-weight="800">Verified answer</text>
  <text x="360" y="520" fill="#f7f0ff" opacity=".68" font-family="Inter, system-ui, sans-serif" font-size="21">Ghost routes the request, retrieves local context,</text>
  <text x="360" y="552" fill="#f7f0ff" opacity=".68" font-family="Inter, system-ui, sans-serif" font-size="21">and returns the result inside the menu-bar panel.</text>
