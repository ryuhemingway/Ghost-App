  <rect x="536" y="620" width="210" height="38" rx="19" fill="#76e4d3" opacity=".18"/><text x="562" y="645" fill="#f7f0ff" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="800">Option-Space</text>
